[global]
type=global

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0

;;;;;;;;;;;;;;;;;;;;;;
;; 1001
;;;;;;;;;;;;;;;;;;;;;;

[1001]
type=endpoint
context=internal
disallow=all
allow=ulaw,alaw
auth=1001-auth
aors=1001
direct_media=no
rewrite_contact=yes
force_rport=yes
rtp_symmetric=yes

[1001-auth]
type=auth
auth_type=userpass
username=1001
password=1234

[1001]
type=aor
max_contacts=1

