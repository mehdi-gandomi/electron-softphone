appId: com.emdadphone.app
productName: EmdadPhone
directories:
  buildResources: resources
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!scripts/**'
  - '!.githooks/**'
  - '!electron.vite.config.*'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md,RELEASE.md,release-notes.md}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
extraResources:
  - from: resources/logo.png
    to: logo.png
  - from: resources/icon.png
    to: icon.png
win:
  icon: resources/icon.png
  executableName: EmdadPhone
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
publish:
  provider: github
  owner: mehdi-gandomi
  repo: electron-softphone
  releaseType: release
releaseInfo:
  releaseNotesFile: release-notes.md
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  oneClick: false
  allowToChangeInstallationDirectory: true
portable:
  artifactName: ${name}-${version}-portable.${ext}
